<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- The emulator runs in this frame only, so the rest of the site keeps its strict rules.
       It needs WebAssembly ('wasm-unsafe-eval'), 'unsafe-eval' (EmulatorJS's 7z core unpacker builds
       functions at runtime) and blob: scripts/workers for the emulator cores.
       Nothing is loaded from other websites. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Retro Vault player</title>
  <style>
    :root { --ar: 4 / 3; --pad: clamp(118px, 36vw, 168px); --btn: clamp(56px, 17vw, 76px); }
    html, body { margin: 0; height: 100%; background: #05050f; color: #f1f0ff; font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
    [hidden] { display: none !important; }
    #stage { position: relative; width: 100%; height: 100%; }
    #game { width: 100%; height: 100%; }
    .idle { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; }
    .idle p { margin: .3em 0; color: #a4a3c8; }
    .idle b { font-size: 1.4em; color: #22d3ee; letter-spacing: .2em; }
    .err { color: #fda4af; }

    /* ── Touch devices: our own controls replace the emulator's ── */
    body.touch { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    body.touch .ejs_virtualGamepad_parent { display: none !important; }
    #pad { display: none; }
    body.touch #pad { display: flex; }

    /* Portrait: picture on top, controls underneath — nothing overlaps the game. */
    @media (orientation: portrait) {
      body.touch { display: flex; flex-direction: column; }
      body.touch #stage { flex: none; height: auto; aspect-ratio: var(--ar); max-height: calc(100% - 250px); width: 100%; margin: 0 auto; }
      body.touch #pad { flex: 1; min-height: 240px; align-items: center; justify-content: space-between; padding: 8px 14px calc(10px + env(safe-area-inset-bottom, 0px)); }
    }
    /* Landscape (tablets, or a phone turned sideways in Big screen): controls either side of the picture. */
    @media (orientation: landscape) {
      body.touch #stage { position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); height: 100%; width: auto; aspect-ratio: var(--ar); max-width: calc(100% - 2 * (var(--pad) + 28px)); }
      body.touch #pad { position: absolute; inset: 0; pointer-events: none; align-items: center; justify-content: space-between; padding: 10px max(12px, env(safe-area-inset-left, 0px)) 10px max(12px, env(safe-area-inset-right, 0px)); }
      body.touch .tc-side { pointer-events: auto; }
    }

    .tc-side { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .tc-dpad { position: relative; width: var(--pad); height: var(--pad); border-radius: 50%; background: radial-gradient(circle, #1d1d44 0 58%, #14143a 59%); box-shadow: inset 0 0 0 2px #2f2f66; touch-action: none; }
    .tc-dpad span { position: absolute; background: #2c2c5e; border-radius: 6px; }
    .tc-dpad .u, .tc-dpad .d { left: 34%; width: 32%; height: 36%; }
    .tc-dpad .l, .tc-dpad .r { top: 34%; height: 32%; width: 36%; }
    .tc-dpad .u { top: 4%; } .tc-dpad .d { bottom: 4%; } .tc-dpad .l { left: 4%; } .tc-dpad .r { right: 4%; }
    .tc-dpad i { position: absolute; left: 34%; top: 34%; width: 32%; height: 32%; background: #2c2c5e; }
    .tc-dpad[data-dirs~="4"] .u, .tc-dpad[data-dirs~="5"] .d, .tc-dpad[data-dirs~="6"] .l, .tc-dpad[data-dirs~="7"] .r { background: #22d3ee; }

    .tc-face { position: relative; width: calc(var(--btn) * 2.3); height: calc(var(--btn) * 2.3); }
    .tc-btn { position: absolute; width: var(--btn); height: var(--btn); border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: calc(var(--btn) * .3); letter-spacing: .02em; color: #fff; background: linear-gradient(160deg, #f472b6, #8b5cf6); box-shadow: 0 4px 0 #4c1d95, 0 6px 14px #0008; touch-action: none; }
    .tc-btn.on { transform: translateY(3px); box-shadow: 0 1px 0 #4c1d95; filter: brightness(1.25); }
    /* 2 buttons: diagonal like a NES / Game Boy */
    .n2 .p-r { right: 0; top: 8%; } .n2 .p-l { left: 0; bottom: 8%; }
    /* 3 buttons (Mega Drive): a slanted row */
    .tc-face.n3 { width: calc(var(--btn) * 3.25); }
    .n3 .p-l { left: 0; bottom: 4%; } .n3 .p-m { left: calc(50% - var(--btn) / 2); top: 34%; } .n3 .p-r { right: 0; top: 4%; }
    /* 4 buttons (SNES / arcade): diamond */
    .n4 .p-t { top: 0; left: calc(50% - var(--btn) / 2); } .n4 .p-b { bottom: 0; left: calc(50% - var(--btn) / 2); }
    .n4 .p-l { left: 0; top: calc(50% - var(--btn) / 2); } .n4 .p-r { right: 0; top: calc(50% - var(--btn) / 2); }
    .n4 .tc-btn { width: calc(var(--btn) * .86); height: calc(var(--btn) * .86); }
    .n4 .p-t, .n4 .p-b { left: calc(50% - var(--btn) * .43); } .n4 .p-l, .n4 .p-r { top: calc(50% - var(--btn) * .43); }
    /* 1 button (Atari) */
    .n1 .p-m { left: calc(50% - var(--btn) * .6); top: calc(50% - var(--btn) * .6); width: calc(var(--btn) * 1.2); height: calc(var(--btn) * 1.2); }
    .tc-small, .tc-shoulder { min-width: 74px; padding: 6px 12px; border-radius: 999px; text-align: center; font-weight: 800; font-size: 12px; letter-spacing: .08em; color: #d6d5f0; background: #22224d; box-shadow: inset 0 0 0 1px #45458a; touch-action: none; }
    .tc-shoulder { min-width: 88px; padding: 8px 14px; font-size: 14px; }
    .tc-small.on, .tc-shoulder.on { background: #22d3ee; color: #0b0b1a; }
    .tc-spacer { visibility: hidden; }
    /* GBA / SNES have L and R too: tighter spacing so everything fits */
    .has-shoulders .tc-side { gap: 8px; }
    .has-shoulders .tc-shoulder { padding: 6px 14px; font-size: 13px; }
    .has-shoulders .n4 .tc-btn { width: calc(var(--btn) * .8); height: calc(var(--btn) * .8); }
    .has-shoulders .n4 .p-t, .has-shoulders .n4 .p-b { left: calc(50% - var(--btn) * .4); } .has-shoulders .n4 .p-l, .has-shoulders .n4 .p-r { top: calc(50% - var(--btn) * .4); }
    @media (orientation: portrait) and (max-height: 520px) { :root { --pad: 112px; --btn: 52px; } .tc-side { gap: 8px; } }
  </style>
</head>
<body>
  <div id="stage">
    <div id="game"></div>
    <div class="idle" id="idle"><div><b>INSERT GAME</b><p>Pick a game, or load your own ROM.</p></div></div>
  </div>
  <div id="pad" aria-hidden="true"></div>
  <script type="module" src="../assets/js/retro-player.js"></script>
</body>
</html>
