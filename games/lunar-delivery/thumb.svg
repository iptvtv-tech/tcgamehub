<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="earth" cx=".38" cy=".35" r=".7"><stop offset="0" stop-color="#7dd3fc"/><stop offset=".55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#0b1a4a"/></radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ca3af"/><stop offset="1" stop-color="#4b5563"/></linearGradient>
    <radialGradient id="flame" cx=".5" cy=".2" r=".8"><stop offset="0" stop-color="#fff7ed"/><stop offset=".4" stop-color="#fb923c"/><stop offset="1" stop-color="#fb923c" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="200" height="200" fill="#04050c"/>
  <g fill="#fff"><circle cx="18" cy="20" r=".9"/><circle cx="52" cy="44" r=".7"/><circle cx="96" cy="14" r="1.1"/><circle cx="120" cy="58" r=".6"/><circle cx="30" cy="96" r=".8"/><circle cx="182" cy="104" r=".7"/><circle cx="78" cy="78" r=".6"/></g>
  <!-- Earth over the horizon -->
  <circle cx="156" cy="40" r="22" fill="url(#earth)"/>
  <path d="M146 30c5-3 11 1 9 6s-9 3-12 7c-2-4-1-10 3-13zM160 48c4 0 7 3 5 6s-6 1-5-6z" fill="#4d7c0f" opacity=".8"/>
  <path d="M138 52a22 22 0 0 0 36 0a24 24 0 0 1-36 0z" fill="#000" opacity=".55"/>
  <!-- moon ground with a crater and the landing pad -->
  <path d="M0 150 Q40 136 80 146 T150 142 T200 150 V200 H0z" fill="url(#ground)"/>
  <ellipse cx="44" cy="170" rx="26" ry="6" fill="#374151"/><ellipse cx="44" cy="168" rx="26" ry="5" fill="none" stroke="#d1d5db" stroke-width="1.2" opacity=".6"/>
  <ellipse cx="150" cy="168" rx="30" ry="8" fill="#6b7280"/>
  <ellipse cx="150" cy="168" rx="26" ry="6.5" fill="none" stroke="#4ade80" stroke-width="2.2" filter="url(#glow)">
    <animate attributeName="stroke-opacity" values="1;.35;1" dur="1.4s" repeatCount="indefinite"/>
  </ellipse>
  <!-- dome -->
  <path d="M176 152a11 9 0 0 1 22 0z" fill="#e5e7eb"/><rect x="176" y="149" width="22" height="2" fill="#f59e0b"/>
  <!-- the hopper, the cable and the swinging crate -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;3 -4;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="96" cy="86" rx="7" ry="13" fill="url(#flame)"/>
    <path d="M84 72 L74 86 M108 72 L118 86" stroke="#334155" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="71" y="85" width="7" height="2.4" rx="1" fill="#334155"/><rect x="114" y="85" width="7" height="2.4" rx="1" fill="#334155"/>
    <path d="M82 56h28l3 16H79z" fill="#e5e7eb"/><path d="M86 47h20l4 9H82z" fill="#cbd5e1"/>
    <rect x="90" y="49" width="12" height="5" rx="1" fill="#0c4a6e"/>
    <circle cx="78" cy="64" r="4.5" fill="#f59e0b"/><circle cx="114" cy="64" r="4.5" fill="#f59e0b"/>
    <circle cx="80" cy="60" r="1.6" fill="#ef4444" filter="url(#glow)"/><circle cx="112" cy="60" r="1.6" fill="#22c55e" filter="url(#glow)"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-14 96 74;14 96 74;-14 96 74" dur="2.6s" repeatCount="indefinite"/>
      <line x1="96" y1="74" x2="96" y2="114" stroke="#94a3b8" stroke-width="1.2"/>
      <rect x="86" y="113" width="20" height="18" rx="1.5" fill="#f97316"/>
      <path d="M86 113l20 18M106 113l-20 18" stroke="#7c2d12" stroke-width="1.4"/>
      <rect x="86" y="113" width="20" height="18" rx="1.5" fill="none" stroke="#3f3f46" stroke-width="1.6"/>
    </g>
  </g>
  <!-- stardust -->
  <g fill="#67e8f9" filter="url(#glow)"><path d="M132 92l3 5-3 5-3-5z"/><path d="M146 104l3 5-3 5-3-5z"/><path d="M58 108l3 5-3 5-3-5z"/></g>
  <path d="M120 84l4 6-4 6-4-6z" fill="#fde047" filter="url(#glow)"/>
</svg>
