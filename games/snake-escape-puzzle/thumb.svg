<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07131a"/><stop offset="1" stop-color="#10081f"/></linearGradient>
  </defs>
  <rect width="120" height="120" rx="16" fill="url(#bg)"/>
  <rect x="14" y="14" width="92" height="92" rx="10" fill="#0c1424" stroke="#2dd4bf" stroke-opacity=".45" stroke-width="2"/>
  <g stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-width="11">
    <!-- escaping snake slides out to the right -->
    <path d="M40 30 H60 H80" stroke="#22d3ee">
      <animate attributeName="d" values="M40 30 H60 H80;M60 30 H80 H100;M40 30 H60 H80" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M30 94 V74 H50 V60" stroke="#f472b6"/>
    <path d="M90 94 V70 H70" stroke="#a3e635"/>
    <path d="M30 56 V40" stroke="#fbbf24"/>
    <path d="M58 88 H72" stroke="#a78bfa"/>
  </g>
  <!-- heads -->
  <g>
    <circle cx="80" cy="30" r="7" fill="#22d3ee"><animate attributeName="cx" values="80;100;80" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="50" cy="60" r="7" fill="#f472b6"/>
    <circle cx="70" cy="70" r="7" fill="#a3e635"/>
    <circle cx="30" cy="40" r="7" fill="#fbbf24"/>
    <circle cx="72" cy="88" r="7" fill="#a78bfa"/>
  </g>
  <g fill="#fff">
    <path d="M86 30 L82 27 L82 33Z"><animate attributeName="d" values="M86 30 L82 27 L82 33Z;M106 30 L102 27 L102 33Z;M86 30 L82 27 L82 33Z" dur="2.4s" repeatCount="indefinite"/></path>
    <path d="M50 54 L47 58 L53 58Z"/><path d="M64 70 L68 67 L68 73Z"/><path d="M30 34 L27 38 L33 38Z"/><path d="M78 88 L74 85 L74 91Z"/>
  </g>
</svg>
