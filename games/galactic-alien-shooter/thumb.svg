<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#02030d"/><stop offset="1" stop-color="#1a0b3a"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".7"/><stop offset="1" stop-color="#a3e635" stop-opacity=".12"/></linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#115e59"/></linearGradient>
    <linearGradient id="scout" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9f99d"/><stop offset="1" stop-color="#4d7c0f"/></linearGradient>
    <linearGradient id="gun" x1="0" x2="1"><stop offset="0" stop-color="#9a3412"/><stop offset=".5" stop-color="#fdba74"/><stop offset="1" stop-color="#9a3412"/></linearGradient>
    <linearGradient id="las" x1="0" x2="1"><stop offset="0" stop-color="#f43f5e" stop-opacity="0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#f43f5e" stop-opacity="0"/></linearGradient>
    <linearGradient id="f" x1="0" x2="1"><stop offset="0" stop-color="#94a3b8"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#cbd5e1"/></linearGradient>
  </defs>
  <rect width="120" height="120" rx="16" fill="url(#bg)"/>
  <g fill="#fff"><circle cx="12" cy="18" r="1.2"/><circle cx="104" cy="12" r="1"/><circle cx="100" cy="66" r="1.3" fill="#f472b6"/><circle cx="16" cy="80" r="1" fill="#22d3ee"/><circle cx="58" cy="8" r="1" fill="#fde047"/></g>
  <!-- abduction beam -->
  <path d="M26 34 L34 34 L46 92 L14 92 Z" fill="url(#beam)"><animate attributeName="opacity" values=".9;.4;.9" dur="1.2s" repeatCount="indefinite"/></path>
  <!-- carrier saucer -->
  <g transform="translate(30 30)">
    <path d="M-7 -2 A7 6 0 0 1 7 -2 Z" fill="#a5f3fc" opacity=".8"/>
    <ellipse rx="15" ry="5" fill="url(#hull)"/>
    <ellipse cy="3" rx="8" ry="2" fill="#0f172a"/>
    <g fill="#fef08a"><circle cx="-9" cy="0.5" r="1.2"/><circle cx="-3" cy="0.5" r="1.2"/><circle cx="3" cy="0.5" r="1.2"/><circle cx="9" cy="0.5" r="1.2"/></g>
  </g>
  <!-- gunship -->
  <g transform="translate(86 24)"><path d="M0 8 L6 3 L14 6 L12 -2 L6 -6 L-6 -6 L-12 -2 L-14 6 L-6 3 Z" fill="url(#gun)"/><rect x="-1" y="6" width="2" height="5" fill="#fed7aa"/><ellipse cy="-1" rx="3" ry="2.2" fill="#1c1917"/></g>
  <!-- diving scouts -->
  <g transform="translate(96 52) rotate(25)"><path d="M0 10 L9 -6 L3 -3 L0 -7 L-3 -3 L-9 -6 Z" fill="url(#scout)"/>
    <animateTransform attributeName="transform" type="translate" values="96 52;84 74;96 52" dur="2.4s" repeatCount="indefinite"/></g>
  <g transform="translate(66 46)"><path d="M0 10 L9 -6 L3 -3 L0 -7 L-3 -3 L-9 -6 Z" fill="url(#scout)"/></g>
  <!-- player laser -->
  <rect x="76" y="46" width="8" height="48" fill="url(#las)"><animate attributeName="opacity" values="1;.6;1" dur=".15s" repeatCount="indefinite"/></rect>
  <circle cx="80" cy="46" r="4" fill="#fda4af"><animate attributeName="r" values="3;5;3" dur=".2s" repeatCount="indefinite"/></circle>
  <!-- rocket -->
  <g transform="translate(58 70) rotate(-20)"><path d="M0 -6 L2 -2 L2 4 L-2 4 L-2 -2 Z" fill="#fed7aa"/><path d="M-1.5 4 L0 9 L1.5 4Z" fill="#fde047"/></g>
  <!-- fighter -->
  <g transform="translate(80 102)">
    <path d="M-3 12 L0 20 L3 12Z" fill="#a5f3fc"><animate attributeName="opacity" values="1;.4;1" dur=".2s" repeatCount="indefinite"/></path>
    <path d="M-4 -2 L-15 9 L-15 12 L-4 10Z M4 -2 L15 9 L15 12 L4 10Z" fill="#f43f5e"/>
    <path d="M0 -17 Q6 -3 5 12 L-5 12 Q-6 -3 0 -17Z" fill="url(#f)"/>
    <ellipse cy="-4" rx="2.5" ry="5" fill="#0e7490"/>
  </g>
  <!-- capsule -->
  <g transform="translate(36 104)"><rect x="-10" y="-7" width="20" height="14" rx="7" fill="#0b0b1a" stroke="#fb923c" stroke-width="2"/><text y="4" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="900" font-size="10" fill="#fff">R</text></g>
</svg>
