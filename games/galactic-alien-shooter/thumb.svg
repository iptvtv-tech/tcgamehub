<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#02030d"/><stop offset="1" stop-color="#1a0b3a"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#818cf8" stop-opacity=".7"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".15"/></linearGradient>
    <radialGradient id="q" cx=".4" cy=".35"><stop offset="0" stop-color="#bbf7d0"/><stop offset=".5" stop-color="#34d399"/><stop offset="1" stop-color="#047857"/></radialGradient>
    <linearGradient id="f" x1="0" x2="1"><stop offset="0" stop-color="#94a3b8"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#cbd5e1"/></linearGradient>
  </defs>
  <rect width="120" height="120" rx="16" fill="url(#bg)"/>
  <g fill="#fff"><circle cx="12" cy="18" r="1.2"/><circle cx="104" cy="14" r="1"/><circle cx="96" cy="64" r="1.3" fill="#f472b6"/><circle cx="18" cy="74" r="1" fill="#22d3ee"/><circle cx="58" cy="10" r="1" fill="#fde047"/></g>
  <!-- tractor beam -->
  <path d="M55 42 L65 42 L82 96 L38 96 Z" fill="url(#beam)"><animate attributeName="opacity" values=".9;.4;.9" dur="1.2s" repeatCount="indefinite"/></path>
  <!-- queen -->
  <g transform="translate(60 32)">
    <path d="M-5 0 Q-22 -14 -20 5 Q-12 10 -5 7Z M5 0 Q22 -14 20 5 Q12 10 5 7Z" fill="#2dd4bf" opacity=".9"/>
    <ellipse rx="9" ry="11" fill="url(#q)"/>
    <path d="M-7 -8 L-5 -16 L-2 -10 L0 -18 L2 -10 L5 -16 L7 -8Z" fill="#fde047"/>
    <ellipse cx="-3.5" cy="-2" rx="2" ry="3" fill="#fef08a"/><ellipse cx="3.5" cy="-2" rx="2" ry="3" fill="#fef08a"/>
  </g>
  <!-- drones -->
  <g transform="translate(24 44) rotate(180)"><ellipse cx="-7" cy="2" rx="7" ry="3" fill="#7dd3fc"/><ellipse cx="7" cy="2" rx="7" ry="3" fill="#7dd3fc"/><ellipse cy="3" rx="5" ry="8" fill="#fbbf24"/><circle cy="-7" r="4" fill="#ef4444"/></g>
  <g transform="translate(96 44) rotate(180)"><ellipse cx="-7" cy="2" rx="7" ry="3" fill="#7dd3fc"/><ellipse cx="7" cy="2" rx="7" ry="3" fill="#7dd3fc"/><ellipse cy="3" rx="5" ry="8" fill="#fbbf24"/><circle cy="-7" r="4" fill="#ef4444"/>
    <animateTransform attributeName="transform" type="translate" values="96 44;90 70;96 44" dur="2.4s" repeatCount="indefinite" additive="replace"/></g>
  <!-- shots -->
  <line x1="46" y1="88" x2="46" y2="78" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round">
    <animate attributeName="y1" values="88;40" dur=".7s" repeatCount="indefinite"/><animate attributeName="y2" values="78;30" dur=".7s" repeatCount="indefinite"/>
  </line>
  <!-- fighter -->
  <g transform="translate(46 100)">
    <path d="M-3 12 L0 20 L3 12Z" fill="#a5f3fc"><animate attributeName="opacity" values="1;.4;1" dur=".2s" repeatCount="indefinite"/></path>
    <path d="M-4 -2 L-15 9 L-15 12 L-4 10Z M4 -2 L15 9 L15 12 L4 10Z" fill="#ef4444"/>
    <path d="M0 -17 Q6 -3 5 12 L-5 12 Q-6 -3 0 -17Z" fill="url(#f)"/>
    <ellipse cy="-4" rx="2.5" ry="5" fill="#0e7490"/>
  </g>
</svg>
