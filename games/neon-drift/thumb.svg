    <path d="M-6 200 C 34 160, 78 122, 124 96 L 141 85" stroke="#f8fafc" stroke-dashoffset="8"/>
    <path d="M206 200 C 140 170, 116 130, 138 98 L 149 85" stroke="#f472b6" stroke-width="4"/>
  </g>
  <g fill="none" stroke="#22d3ee" stroke-width="1.6"><path d="M2 200 C 40 162, 82 124, 126 97 L 142 86"/><path d="M198 200 C 134 170, 112 130, 136 98 L 148 86"/></g>
