  <g fill="#a78bfa" opacity=".6"><rect x="64" y="46" width="1.6" height="1.6"/><rect x="68" y="54" width="1.6" height="1.6"/><rect x="140" y="58" width="1.6" height="1.6"/><rect x="156" y="52" width="1.6" height="1.6"/><rect x="28" y="52" width="1.6" height="1.6"/></g>
  <path d="M0 82 V72 h20 v-6 h26 v8 h30 v-4 h40 v6 h28 v-8 h30 v4 h26 V82 Z" fill="#12061f"/>
  <path d="M0 70 h20 M46 66 h26 M144 66 h20" stroke="#f472b6" stroke-width=".8" opacity=".8"/>
  <rect y="79" width="200" height="3" fill="#ff4fa3" opacity=".4"/>
