  <!-- light pillars + holo board -->
  <g stroke-linecap="round"><path d="M30 150 V96" stroke="#22d3ee" stroke-width="2"/><path d="M58 122 V88" stroke="#fde047" stroke-width="1.6"/><path d="M84 106 V82" stroke="#f472b6" stroke-width="1.3"/><path d="M176 150 V100" stroke="#f472b6" stroke-width="2"/></g>
  <rect x="160" y="88" width="36" height="18" rx="1.5" fill="#22d3ee" fill-opacity=".15" stroke="#22d3ee" stroke-width="1.2"/>
  <text x="178" y="101" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="9" fill="#22d3ee">×4</text>
  <!-- rival over the crest -->
  <rect x="132" y="90" width="9" height="5" rx="1.2" fill="#22d3ee"/><rect x="133" y="93" width="7" height="1.2" fill="#f43f5e"/>
