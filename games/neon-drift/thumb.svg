  <!-- striped synthwave sun -->
  <circle cx="96" cy="60" r="44" fill="url(#sunglow)"/>
  <circle cx="96" cy="58" r="26" fill="url(#sun)" clip-path="url(#sunclip)"/>
  <!-- skylines -->
