  <g fill="none" stroke="#ff4fa3" stroke-width="5" opacity=".55"><path d="M70 200 C 76 186, 82 176, 86 168"/><path d="M106 200 C 110 188, 112 178, 114 170"/></g>
  <circle cx="74" cy="182" r="10" fill="#e0dcff" opacity=".18"/><circle cx="110" cy="186" r="12" fill="#e0dcff" opacity=".14"/>
  <!-- your car from behind, tail kicked out -->
  <ellipse cx="102" cy="168" rx="38" ry="10" fill="url(#glow)"/>
  <g transform="translate(101 150) rotate(-9)">
    <path d="M-28 16 L-26 0 L-20 -6 L20 -6 L26 0 L28 16 Z" fill="url(#paint)"/>
