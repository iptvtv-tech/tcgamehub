  <path d="M-30 200 C 20 160, 70 120, 120 96 L 140 84 L 152 84 L 142 98 C 118 130, 150 170, 230 200 Z" fill="#120a24"/>
  <path d="M-6 200 C 34 160, 78 122, 124 96 L 141 85 L 149 85 L 138 98 C 116 130, 140 170, 206 200 Z" fill="url(#road)"/>
