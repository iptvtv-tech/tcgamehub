    <rect x="-24" y="2" width="12" height="4" rx="1" fill="#ff2a45"/><rect x="12" y="2" width="12" height="4" rx="1" fill="#ff2a45"/>
    <rect x="-29" y="12" width="9" height="8" rx="2" fill="#0b0f19"/><rect x="20" y="12" width="9" height="8" rx="2" fill="#0b0f19"/>
    <path d="M-10 16 L-8 30 L-6 16 Z M6 16 L8 30 L10 16 Z" fill="url(#flame)"/>
  </g>
  <circle cx="83" cy="154" r="5" fill="#ff2a45" opacity=".45"/><circle cx="118" cy="150" r="5" fill="#ff2a45" opacity=".45"/>
  <text x="100" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="17" fill="#ff4fa3" stroke="#07021a" stroke-width="3" paint-order="stroke">DRIFT ×4</text>
</svg>
