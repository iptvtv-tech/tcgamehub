<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="sky" cx=".5" cy=".4" r=".9"><stop offset="0" stop-color="#101a3a"/><stop offset="1" stop-color="#05070f"/></radialGradient>
    <radialGradient id="p1" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#f0abfc"/><stop offset="1" stop-color="#701a75"/></radialGradient>
    <radialGradient id="p2" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#6ee7b7"/><stop offset="1" stop-color="#065f46"/></radialGradient>
    <radialGradient id="p3" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#a16207"/></radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="200" height="200" fill="url(#sky)"/>
  <g fill="#cbd5e1" opacity=".8">
    <circle cx="22" cy="30" r="1.2"/><circle cx="178" cy="22" r="1.5"/><circle cx="160" cy="70" r="1"/><circle cx="36" cy="120" r="1.1"/>
    <circle cx="188" cy="150" r="1.2"/><circle cx="90" cy="14" r="1"/><circle cx="12" cy="182" r="1.3"/><circle cx="120" cy="190" r="1"/>
  </g>
  <!-- planets -->
  <circle cx="54" cy="150" r="34" fill="url(#p1)"/>
  <circle cx="150" cy="96" r="24" fill="url(#p2)"/>
  <!-- beacon planet -->
  <circle cx="64" cy="38" r="20" fill="url(#p3)" filter="url(#glow)"/>
  <circle cx="64" cy="38" r="27" fill="none" stroke="#fde047" stroke-width="2" stroke-dasharray="4 5" opacity=".7"/>
  <text x="64" y="44" font-size="17" text-anchor="middle" fill="#78350f" font-family="system-ui" font-weight="700">★</text>
  <!-- flight path -->
  <path d="M 84 166 C 130 170 172 140 150 96 C 130 56 96 64 64 38" fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-dasharray="1 7" stroke-linecap="round" opacity=".9" filter="url(#glow)"/>
  <!-- hopper -->
  <g transform="translate(138,120) rotate(-40)" filter="url(#glow)">
    <path d="M0,-9 L7,7 L-7,7 Z" fill="#e0f2fe"/>
    <circle cx="0" cy="-1" r="3.2" fill="#0ea5e9"/>
    <path d="M-3.5,8 L3.5,8 L0,15 Z" fill="#67e8f9" opacity=".8"/>
  </g>
</svg>
