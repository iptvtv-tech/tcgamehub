<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="sky" cx=".5" cy=".4" r=".9"><stop offset="0" stop-color="#101a3a"/><stop offset="1" stop-color="#05070f"/></radialGradient>
    <radialGradient id="core" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#334a7a"/><stop offset="1" stop-color="#101a33"/></radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="200" height="200" fill="url(#sky)"/>
  <g fill="#cbd5e1" opacity=".8">
    <circle cx="22" cy="30" r="1.2"/><circle cx="178" cy="22" r="1.5"/><circle cx="160" cy="176" r="1"/><circle cx="36" cy="120" r="1.1"/>
    <circle cx="188" cy="110" r="1.2"/><circle cx="90" cy="14" r="1"/><circle cx="12" cy="182" r="1.3"/><circle cx="120" cy="192" r="1"/>
  </g>
  <!-- outer traffic ring -->
  <circle cx="100" cy="100" r="62" fill="none" stroke="#67e8f9" stroke-width="1.5" stroke-dasharray="7 10" opacity=".35"/>
  <!-- bay arms -->
  <g filter="url(#glow)">
    <rect x="128" y="88" width="28" height="24" rx="5" fill="#141b30" stroke="#f472b6" stroke-width="2.5"/>
    <rect x="44" y="88" width="28" height="24" rx="5" fill="#141b30" stroke="#22d3ee" stroke-width="2.5"/>
    <rect x="88" y="44" width="24" height="26" rx="5" fill="#141b30" stroke="#fcd34d" stroke-width="2.5"/>
  </g>
  <!-- station core -->
  <circle cx="100" cy="100" r="30" fill="url(#core)" stroke="#3b5a96" stroke-width="2"/>
  <g fill="#67e8f9" opacity=".85">
    <rect x="88" y="92" width="4" height="4"/><rect x="104" y="88" width="4" height="4"/><rect x="96" y="106" width="4" height="4"/><rect x="110" y="102" width="4" height="4"/>
  </g>
  <!-- bay shape badges -->
  <path d="M 162 94 l 6 10 h -12 Z" fill="#f472b6"/>
  <path d="M 38 94 l 6 6 l -6 6 l -6 -6 Z" fill="#22d3ee"/>
  <circle cx="100" cy="36" r="5.5" fill="#fcd34d"/>
  <!-- flight route -->
  <path d="M 34 170 C 70 160 86 130 98 72 C 100 62 100 52 100 44" fill="none" stroke="#fcd34d" stroke-width="2.5" stroke-dasharray="1 7" stroke-linecap="round" opacity=".9" filter="url(#glow)"/>
  <!-- routed ship -->
  <g transform="translate(92,96) rotate(-80)" filter="url(#glow)">
    <path d="M 12,0 L -8,-8 L -4,0 L -8,8 Z" fill="#7c2d12" stroke="#fcd34d" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#fde68a"/>
  </g>
  <!-- drifting ship -->
  <g transform="translate(160,150) rotate(-140)">
    <path d="M 12,0 L -8,-8 L -4,0 L -8,8 Z" fill="#164e63" stroke="#22d3ee" stroke-width="2"/>
    <path d="M 0,-4 l 4 4 l -4 4 l -4 -4 Z" fill="#a5f3fc"/>
  </g>
</svg>
