<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".42" r=".75"><stop offset="0" stop-color="#1b1350"/><stop offset="1" stop-color="#020110"/></radialGradient>
    <radialGradient id="core" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#e0f2fe"/><stop offset=".4" stop-color="#38bdf8" stop-opacity=".5"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#94a3b8"/></linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#64748b"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <linearGradient id="cock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a5f3fc"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
    <radialGradient id="jet" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="#38bdf8"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <radialGradient id="enemy" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fda4af"/><stop offset=".5" stop-color="#e11d48"/><stop offset="1" stop-color="#4c0519"/></radialGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- the 3D corridor rushing towards you -->
  <g fill="none" stroke="#22d3ee">
    <rect x="86" y="70" width="28" height="20" opacity=".55"/><rect x="70" y="58" width="60" height="44" opacity=".45"/><rect x="46" y="40" width="108" height="78" opacity=".35"/><rect x="10" y="14" width="180" height="130" opacity=".25"/>
    <g opacity=".3"><line x1="86" y1="70" x2="-20" y2="-10"/><line x1="114" y1="70" x2="220" y2="-10"/><line x1="86" y1="90" x2="-20" y2="190"/><line x1="114" y1="90" x2="220" y2="190"/></g>
  </g>
  <circle cx="100" cy="80" r="26" fill="url(#core)"/>
  <!-- streaking stars -->
  <g stroke="#e0f2fe" stroke-linecap="round" opacity=".7"><line x1="60" y1="60" x2="40" y2="48" stroke-width="1.5"/><line x1="146" y1="58" x2="170" y2="44" stroke-width="1.5"/><line x1="150" y1="104" x2="180" y2="116" stroke-width="2"/><line x1="48" y1="102" x2="18" y2="114" stroke-width="2"/><line x1="100" y1="40" x2="100" y2="22" stroke-width="1"/></g>
  <!-- enemy ahead -->
  <g transform="translate(128 66)"><ellipse rx="10" ry="5" fill="url(#enemy)"/><ellipse cy="-3" rx="4" ry="3" fill="#fecdd3"/><rect x="-15" y="-1" width="6" height="2" fill="#be123c"/><rect x="9" y="-1" width="6" height="2" fill="#be123c"/></g>
  <!-- laser bolts -->
  <g stroke="#67e8f9" stroke-width="3" stroke-linecap="round"><line x1="78" y1="118" x2="90" y2="96"/><line x1="122" y1="118" x2="110" y2="96"/></g>
  <!-- the starfighter, from behind and above, lit from the top -->
  <ellipse cx="100" cy="186" rx="50" ry="6" fill="#38bdf8" opacity=".15"/>
  <polygon points="100,120 58,170 42,176 70,176 100,160 130,176 158,176 142,170" fill="url(#top)"/>
  <polygon points="42,176 70,176 100,160 130,176 158,176 154,182 128,182 100,170 72,182 46,182" fill="url(#side)"/>
  <polygon points="100,112 90,164 100,176 110,164" fill="url(#top)"/>
  <polygon points="100,124 94,150 100,156 106,150" fill="url(#cock)"/>
  <path d="M96 132 L100 126" stroke="#fff" stroke-width="1.5" opacity=".8"/>
  <rect x="38" y="168" width="10" height="4" fill="#e2e8f0"/><rect x="152" y="168" width="10" height="4" fill="#e2e8f0"/>
  <g fill="#f472b6"><rect x="40" y="172" width="6" height="2"/><rect x="154" y="172" width="6" height="2"/></g>
  <circle cx="86" cy="180" r="9" fill="url(#jet)"/><circle cx="114" cy="180" r="9" fill="url(#jet)"/>
  <circle cx="100" cy="182" r="7" fill="url(#jet)"/>
</svg>
