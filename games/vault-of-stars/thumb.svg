<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Deep space background -->
  <rect width="200" height="200" fill="#0d1117"/>
  <!-- Stars -->
  <circle cx="20"  cy="15"  r="1"   fill="#e0f2fe" opacity="0.8"/>
  <circle cx="50"  cy="30"  r="1.5" fill="#e0f2fe" opacity="0.6"/>
  <circle cx="90"  cy="10"  r="1"   fill="#e0f2fe" opacity="0.9"/>
  <circle cx="130" cy="25"  r="1.2" fill="#e0f2fe" opacity="0.7"/>
  <circle cx="170" cy="12"  r="1"   fill="#e0f2fe" opacity="0.8"/>
  <circle cx="185" cy="40"  r="1.5" fill="#e0f2fe" opacity="0.5"/>
  <circle cx="10"  cy="60"  r="1"   fill="#e0f2fe" opacity="0.6"/>
  <circle cx="160" cy="55"  r="1"   fill="#e0f2fe" opacity="0.7"/>
  <!-- Alien moon surface (arc at bottom) -->
  <ellipse cx="100" cy="230" rx="130" ry="60" fill="#1e3a5f" opacity="0.6"/>
  <!-- Vault grid floor tiles -->
  <g opacity="0.7">
    <rect x="20" y="70"  width="32" height="32" rx="3" fill="#0a1929" stroke="#1e3a5f" stroke-width="1"/>
    <rect x="56" y="70"  width="32" height="32" rx="3" fill="#0a1929" stroke="#1e3a5f" stroke-width="1"/>
    <rect x="92" y="70"  width="32" height="32" rx="3" fill="#0a1929" stroke="#1e3a5f" stroke-width="1"/>
    <rect x="128" y="70" width="32" height="32" rx="3" fill="#0a1929" stroke="#1e3a5f" stroke-width="1"/>
    <rect x="20" y="106" width="32" height="32" rx="3" fill="#0a1929" stroke="#1e3a5f" stroke-width="1"/>
    <rect x="56" y="106" width="32" height="32" rx="3" fill="#0a1929" stroke="#1e3a5f" stroke-width="1"/>
    <rect x="92" y="106" width="32" height="32" rx="3" fill="#0a1929" stroke="#1e3a5f" stroke-width="1"/>
    <rect x="128" y="106" width="32" height="32" rx="3" fill="#0a1929" stroke="#1e3a5f" stroke-width="1"/>
    <!-- Wall tiles -->
    <rect x="164" y="70"  width="16" height="68" rx="2" fill="#1e3a5f"/>
    <rect x="20"  y="142" width="140" height="14" rx="2" fill="#1e3a5f"/>
  </g>
  <!-- Laser grid (red) -->
  <rect x="56" y="70" width="32" height="32" rx="3" fill="#ef4444" opacity="0.25"/>
  <line x1="56" y1="86" x2="88" y2="86" stroke="#ef4444" stroke-width="2" opacity="0.9"/>
  <line x1="72" y1="70" x2="72" y2="102" stroke="#ef4444" stroke-width="2" opacity="0.9"/>
  <!-- Drift tile (purple arrow) -->
  <rect x="128" y="106" width="32" height="32" rx="3" fill="#818cf8" opacity="0.2"/>
  <text x="144" y="128" font-size="18" text-anchor="middle" fill="#818cf8" opacity="0.8">→</text>
  <!-- Sentry drone -->
  <circle cx="36" cy="122" r="10" fill="#f59e0b"/>
  <circle cx="36" cy="119" r="4"  fill="#ef4444"/>
  <circle cx="36" cy="122" r="14" fill="#f59e0b" opacity="0.15"/>
  <!-- Astronaut player -->
  <circle cx="108" cy="86"  r="12" fill="#38bdf8" opacity="0.25"/>
  <circle cx="108" cy="86"  r="9"  fill="#e0f2fe"/>
  <circle cx="108" cy="86"  r="7"  fill="#38bdf8" opacity="0.7"/>
  <!-- Access key -->
  <text x="144" y="92" font-size="16" text-anchor="middle">🔑</text>
  <!-- Golden Beacon star at top centre -->
  <circle cx="100" cy="40" r="22" fill="#fde047" opacity="0.15"/>
  <circle cx="100" cy="40" r="14" fill="#fde047" opacity="0.3"/>
  <text x="100" y="49" font-size="22" text-anchor="middle">⭐</text>
  <!-- Title text -->
  <text x="100" y="175" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#38bdf8" letter-spacing="1">VAULT OF STARS</text>
  <text x="100" y="190" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#818cf8" opacity="0.7">Zone 5 · Beyond · 👑 LEGENDS</text>
</svg>
