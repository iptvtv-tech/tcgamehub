<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86efac"/><stop offset="1" stop-color="#16a34a"/></linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#14532d"/></linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#78716c"/><stop offset="1" stop-color="#44403c"/></linearGradient>
    <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdba74"/><stop offset=".5" stop-color="#f97316"/><stop offset="1" stop-color="#9a3412"/></linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c2410c"/><stop offset="1" stop-color="#7c2d12"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0f2fe"/><stop offset="1" stop-color="#0369a1"/></linearGradient>
    <radialGradient id="egg" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#fef3c7"/><stop offset="1" stop-color="#d6a96b"/></radialGradient>
    <radialGradient id="tyre" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#4b5563"/><stop offset="1" stop-color="#0b0f19"/></radialGradient>
    <radialGradient id="hub" cx=".35" cy=".3" r=".7"><stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#64748b"/></radialGradient>
  </defs>
  <rect width="200" height="200" fill="url(#sky)"/>
  <circle cx="160" cy="36" r="16" fill="#fde047"/><circle cx="160" cy="36" r="24" fill="#fde047" opacity=".25"/>
  <g fill="#fff" opacity=".9"><ellipse cx="44" cy="40" rx="20" ry="7"/><ellipse cx="58" cy="34" rx="12" ry="8"/><ellipse cx="110" cy="58" rx="14" ry="5"/></g>
  <path d="M-10 120 Q40 70 90 104 Q140 76 210 112 L210 200 L-10 200Z" fill="url(#hill1)"/>
  <path d="M-10 150 Q60 112 120 140 Q170 120 210 140 L210 200 L-10 200Z" fill="url(#hill2)"/>
  <!-- the road ramps up across the hill, with depth -->
  <path d="M-10 168 Q70 128 140 150 Q180 160 210 150 L210 172 Q180 182 140 172 Q70 150 -10 190Z" fill="url(#road)"/>
  <path d="M-10 168 Q70 128 140 150 Q180 160 210 150" stroke="#d6d3d1" stroke-width="2" fill="none"/>
  <path d="M10 178 Q70 142 140 161 Q180 170 210 161" stroke="#fde047" stroke-width="2" fill="none" stroke-dasharray="10 9"/>
  <!-- 3D truck tipped up as it climbs -->
  <g transform="translate(96 136) rotate(-12)">
    <ellipse cx="0" cy="22" rx="46" ry="6" fill="#000" opacity=".25"/>
    <!-- far side of the body (depth) -->
    <polygon points="-40,-6 32,-6 38,-10 -34,-10" fill="#fed7aa"/>
    <polygon points="12,-24 32,-24 38,-28 18,-28" fill="#fed7aa"/>
    <rect x="-40" y="-6" width="52" height="18" rx="2" fill="url(#paint)"/>
    <path d="M12 12 L12 -24 L30 -24 L40 -4 L40 12 Z" fill="url(#paint)"/>
    <path d="M16 -20 L28 -20 L35 -6 L16 -6 Z" fill="url(#glass)"/>
    <rect x="-40" y="10" width="80" height="6" fill="url(#side)"/>
    <rect x="-40" y="0" width="80" height="2" fill="#fff" opacity=".45"/>
    <rect x="38" y="2" width="4" height="4" fill="#fef9c3"/><rect x="-42" y="2" width="3" height="4" fill="#ef4444"/>
    <!-- egg cup + the egg -->
    <path d="M-22 -6 L-26 -14 L-6 -14 L-10 -6 Z" fill="#cbd5e1"/>
    <ellipse cx="-16" cy="-27" rx="10" ry="13" fill="url(#egg)"/>
    <path d="M-12 -34 l2 4 -3 3 2 4" stroke="#a16207" stroke-width="1" fill="none" opacity=".6"/>
    <!-- wheels -->
    <circle cx="-24" cy="16" r="10" fill="url(#tyre)"/><circle cx="-24" cy="16" r="4.5" fill="url(#hub)"/>
    <circle cx="24" cy="16" r="10" fill="url(#tyre)"/><circle cx="24" cy="16" r="4.5" fill="url(#hub)"/>
  </g>
  <!-- motion puffs -->
  <g fill="#fff" opacity=".7"><circle cx="40" cy="164" r="5"/><circle cx="30" cy="168" r="3.5"/><circle cx="22" cy="172" r="2.5"/></g>
</svg>
