  <g>
    <g transform="translate(0,0)">
      <circle cx="54" cy="44" r="8" fill="url(#r)"/><circle cx="71" cy="44" r="8" fill="url(#y)"/><circle cx="88" cy="44" r="8" fill="url(#y)"/><circle cx="105" cy="44" r="8" fill="url(#b)"/><circle cx="122" cy="44" r="8" fill="url(#g)"/><circle cx="139" cy="44" r="8" fill="url(#p)"/><circle cx="156" cy="44" r="8" fill="url(#r)" opacity="0"/>
      <circle cx="61" cy="58" r="8.6" fill="url(#g)"/><circle cx="79" cy="58" r="8.6" fill="url(#b)"/><circle cx="97" cy="58" r="8.6" fill="url(#b)"/><circle cx="115" cy="58" r="8.6" fill="url(#r)"/><circle cx="133" cy="58" r="8.6" fill="url(#y)"/>
      <circle cx="50" cy="74" r="9.3" fill="url(#p)"/><circle cx="69" cy="74" r="9.3" fill="url(#p)"/><circle cx="88" cy="74" r="9.3" fill="url(#g)"/><circle cx="107" cy="74" r="9.3" fill="url(#r)"/><circle cx="126" cy="74" r="9.3" fill="url(#b)"/><circle cx="145" cy="74" r="9.3" fill="url(#y)"/>
      <circle cx="78" cy="91" r="10" fill="url(#y)"/><circle cx="99" cy="91" r="10" fill="url(#r)"/><circle cx="120" cy="91" r="10" fill="url(#g)"/>
    </g>
    <g fill="#fff"><path d="M131 69 l1.2 3 3 1.2 -3 1.2 -1.2 3 -1.2 -3 -3 -1.2 3 -1.2z"/></g>
  </g>
  <!-- aim dots -->
  <g fill="#fff" opacity=".7"><circle cx="100" cy="150" r="2"/><circle cx="102" cy="136" r="1.8"/><circle cx="104" cy="123" r="1.6"/><circle cx="106" cy="112" r="1.4"/><circle cx="108" cy="103" r="1.2"/></g>
  <!-- flying shot -->
  <ellipse cx="112" cy="122" rx="8" ry="3" fill="url(#sh)"/><circle cx="110" cy="114" r="10.5" fill="url(#b)"/>
  <!-- 3D launcher turret -->
  <ellipse cx="100" cy="190" rx="44" ry="14" fill="#0f172a"/>
  <ellipse cx="100" cy="184" rx="42" ry="14" fill="#334155"/>
  <ellipse cx="100" cy="180" rx="34" ry="11" fill="#475569"/>
  <polygon points="92,182 108,182 105,150 95,150" fill="url(#turret)"/><ellipse cx="100" cy="150" rx="6" ry="2.5" fill="#e2e8f0"/>
  <rect x="98.5" y="154" width="3" height="22" fill="#38bdf8"/>
  <ellipse cx="100" cy="180" rx="22" ry="7" fill="none" stroke="#fde047" stroke-width="3" stroke-dasharray="90 40"/>
  <circle cx="100" cy="176" r="12" fill="url(#r)"/>
</svg>
