<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".3" r=".8"><stop offset="0" stop-color="#1e1b6b"/><stop offset="1" stop-color="#050a2e"/></radialGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121842"/><stop offset="1" stop-color="#2d1462"/></linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c8db5"/><stop offset="1" stop-color="#38425f"/></linearGradient>
    <radialGradient id="r" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff"/><stop offset=".22" stop-color="#fb7185"/><stop offset="1" stop-color="#881337"/></radialGradient>
    <radialGradient id="y" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff"/><stop offset=".22" stop-color="#fde047"/><stop offset="1" stop-color="#a16207"/></radialGradient>
    <radialGradient id="g" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff"/><stop offset=".22" stop-color="#4ade80"/><stop offset="1" stop-color="#14532d"/></radialGradient>
    <radialGradient id="b" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff"/><stop offset=".22" stop-color="#60a5fa"/><stop offset="1" stop-color="#1e3a8a"/></radialGradient>
    <radialGradient id="p" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff"/><stop offset=".22" stop-color="#c084fc"/><stop offset="1" stop-color="#581c87"/></radialGradient>
    <radialGradient id="sh" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <linearGradient id="turret" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1e293b"/><stop offset=".5" stop-color="#94a3b8"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
