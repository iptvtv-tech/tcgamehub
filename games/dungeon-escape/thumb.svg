<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="light" cx=".7" cy=".75" r=".8"><stop offset="0" stop-color="#ff9a3c" stop-opacity=".5"/><stop offset=".6" stop-color="#5a2a0a" stop-opacity=".15"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <linearGradient id="wallL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7a7068"/><stop offset="1" stop-color="#151314"/></linearGradient>
    <linearGradient id="wallR" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#5e5650"/><stop offset="1" stop-color="#151314"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#4a4038"/><stop offset="1" stop-color="#0a0909"/></linearGradient>
    <radialGradient id="ghoul" cx=".42" cy=".3" r=".75"><stop offset="0" stop-color="#9ff0b4"/><stop offset=".5" stop-color="#2f7a45"/><stop offset="1" stop-color="#062010"/></radialGradient>
    <radialGradient id="eye" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fffbe0"/><stop offset=".35" stop-color="#fde047"/><stop offset="1" stop-color="#fde047" stop-opacity="0"/></radialGradient>
    <radialGradient id="flame" cx=".5" cy=".6" r=".5"><stop offset="0" stop-color="#fff7d6"/><stop offset=".4" stop-color="#ffb02e"/><stop offset="1" stop-color="#ff5a10" stop-opacity="0"/></radialGradient>
    <radialGradient id="stairs" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fde68a" stop-opacity=".9"/><stop offset="1" stop-color="#fde68a" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="200" height="200" fill="#040304"/>
  <!-- maze corridor turning a corner -->
  <polygon points="0,0 74,64 74,128 0,200" fill="url(#wallL)"/>
  <polygon points="200,0 150,40 150,150 200,200" fill="url(#wallR)"/>
  <polygon points="150,40 126,62 126,128 150,150" fill="#2a2522"/>
  <polygon points="0,200 200,200 126,128 74,128" fill="url(#floor)"/>
  <rect x="74" y="64" width="52" height="64" fill="#0e0c0d"/>
  <g stroke="#000" stroke-opacity=".6" stroke-width="1.5" fill="none">
    <path d="M0 50 L74 92 M0 100 L74 106 M0 150 L74 118 M28 24 L28 176 M52 44 L52 152"/>
    <path d="M200 50 L150 70 M200 100 L150 98 M200 150 L150 128 M176 20 L176 180"/>
    <path d="M50 200 L94 128 M150 200 L108 128 M20 176 L180 176 M50 148 L150 148"/>
  </g>
  <g fill="#3f6212" opacity=".7"><rect x="10" y="60" width="6" height="3"/><rect x="40" y="90" width="5" height="4"/><rect x="186" y="110" width="6" height="3"/></g>
  <!-- golden stairs glow at the far end -->
  <circle cx="100" cy="122" r="22" fill="url(#stairs)"/>
  <g fill="#6b6259"><rect x="88" y="118" width="24" height="3"/><rect x="91" y="121" width="18" height="3" fill="#4d463e"/><rect x="94" y="124" width="12" height="3" fill="#2f2a25"/></g>
  <!-- the ghoul -->
  <g transform="translate(100 100)">
    <path d="M-22 34 Q-26 -14 0 -20 Q26 -14 22 34 L16 28 L10 34 L4 28 L-2 34 L-8 28 L-14 34 Z" fill="url(#ghoul)"/>
    <ellipse cx="-8" cy="-6" rx="5" ry="4" fill="#062010"/><ellipse cx="8" cy="-6" rx="5" ry="4" fill="#062010"/>
    <ellipse cx="0" cy="8" rx="9" ry="5" fill="#041a0c"/>
    <g fill="#ecebe4"><polygon points="-7,4 -5,9 -3,4"/><polygon points="-2,4 0,9 2,4"/><polygon points="3,4 5,9 7,4"/></g>
  </g>
  <circle cx="92" cy="94" r="7" fill="url(#eye)"/><circle cx="108" cy="94" r="7" fill="url(#eye)"/>
  <circle cx="92" cy="94" r="1.4" fill="#dc2626"/><circle cx="108" cy="94" r="1.4" fill="#dc2626"/>
  <!-- key on the floor -->
  <g transform="translate(46 168) rotate(-20)"><circle r="5" fill="none" stroke="#fbbf24" stroke-width="3"/><rect x="4" y="-1.5" width="14" height="3" fill="#fbbf24"/><rect x="13" y="1" width="3" height="4" fill="#fbbf24"/></g>
  <!-- torchlight -->
  <rect width="200" height="200" fill="url(#light)"/>
  <!-- your torch, burning low -->
  <g transform="translate(160 162) rotate(18)">
    <rect x="-5" y="0" width="10" height="60" fill="#5b3418"/><rect x="-7" y="-3" width="14" height="5" fill="#3a3a42"/>
    <ellipse cx="0" cy="-12" rx="11" ry="16" fill="url(#flame)"/>
  </g>
</svg>
