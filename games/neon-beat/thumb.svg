<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0620"/><stop offset="1" stop-color="#2a0b3a"/></linearGradient>
    <path id="a" d="M0 9 L10 -1 L4 -1 L4 -9 L-4 -9 L-4 -1 L-10 -1 Z"/>
  </defs>
  <rect width="120" height="120" rx="16" fill="url(#bg)"/>
  <g stroke="#a78bfa" stroke-opacity=".25"><line x1="20" y1="10" x2="20" y2="110"/><line x1="40" y1="10" x2="40" y2="110"/><line x1="60" y1="10" x2="60" y2="110"/><line x1="80" y1="10" x2="80" y2="110"/><line x1="100" y1="10" x2="100" y2="110"/></g>
  <rect x="20" y="88" width="80" height="3" fill="#fff" opacity=".25"/>
  <!-- receptors -->
  <g fill="none" stroke-width="2">
    <use href="#a" transform="translate(30 90) rotate(90)" stroke="#f472b6"/>
    <use href="#a" transform="translate(50 90)" stroke="#22d3ee"/>
    <use href="#a" transform="translate(70 90) rotate(180)" stroke="#a3e635"/>
    <use href="#a" transform="translate(90 90) rotate(-90)" stroke="#fbbf24"/>
  </g>
  <!-- falling notes -->
  <g>
    <use href="#a" fill="#f472b6" transform="translate(30 30) rotate(90)"><animateTransform attributeName="transform" type="translate" values="30 20;30 90" dur="1.6s" repeatCount="indefinite" additive="replace"/></use>
    <use href="#a" fill="#22d3ee" transform="translate(50 60)"><animateTransform attributeName="transform" type="translate" values="50 50;50 120" dur="1.6s" repeatCount="indefinite"/></use>
    <rect x="66" y="30" width="8" height="30" rx="4" fill="#a3e635" opacity=".8"/>
    <use href="#a" fill="#a3e635" transform="translate(70 60) rotate(180)"/>
    <use href="#a" fill="#fbbf24" transform="translate(90 40) rotate(-90)"/>
  </g>
  <text x="60" y="112" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="900" font-size="9" fill="#fde047">PERFECT</text>
</svg>
