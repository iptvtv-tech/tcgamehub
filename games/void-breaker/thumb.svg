<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="sky" cx=".7" cy=".3" r=".9"><stop offset="0" stop-color="#4c1d95"/><stop offset=".5" stop-color="#1e0b3a"/><stop offset="1" stop-color="#05030f"/></radialGradient>
    <radialGradient id="hole" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000"/><stop offset=".3" stop-color="#000"/><stop offset=".34" stop-color="#fff7ed"/><stop offset=".45" stop-color="#fb923c" stop-opacity=".9"/><stop offset=".75" stop-color="#a855f7" stop-opacity=".45"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0820"/><stop offset="1" stop-color="#150a33"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="200" height="200" fill="url(#sky)"/>
  <g fill="#fff" opacity=".8"><circle cx="20" cy="22" r=".9"/><circle cx="60" cy="12" r="1.1"/><circle cx="95" cy="40" r=".7"/><circle cx="30" cy="70" r=".8"/><circle cx="180" cy="90" r=".9"/><circle cx="120" cy="18" r=".7"/></g>
  <!-- the void rift -->
  <circle cx="148" cy="48" r="34" fill="url(#hole)">
    <animateTransform attributeName="transform" type="rotate" from="0 148 48" to="360 148 48" dur="8s" repeatCount="indefinite"/>
  </circle>
  <!-- hex floor -->
  <polygon points="0,128 200,128 200,200 0,200" fill="url(#floor)"/>
  <g stroke="#818cf8" stroke-width="1.2" fill="none" opacity=".85" filter="url(#glow)">
    <path d="M0,128 H200"/>
    <path d="M10,140 L30,134 L55,140 L80,134 L105,140 L130,134 L155,140 L180,134 L200,138"/>
    <path d="M0,158 L28,150 L60,158 L92,150 L124,158 L156,150 L188,158 L200,155"/>
    <path d="M0,186 L35,176 L75,186 L115,176 L155,186 L195,176"/>
    <path d="M30,134 L28,150 M80,134 L92,150 M130,134 L124,158 M180,134 L188,158 M28,150 L35,176 M92,150 L75,186 M156,150 L155,186"/>
  </g>
  <!-- pylon -->
  <polygon points="22,128 28,128 26,70 24,70" fill="#0b0820"/><circle cx="25" cy="68" r="4" fill="#c084fc" filter="url(#glow)"/>
  <!-- neon invaders -->
  <g filter="url(#glow)" stroke-width="1.6" stroke-linejoin="round">
    <polygon points="70,62 86,92 54,92" fill="#0e7490" fill-opacity=".55" stroke="#67e8f9"><animateTransform attributeName="transform" type="translate" values="0 0;4 6;0 0" dur="2.2s" repeatCount="indefinite"/></polygon>
    <g transform="translate(118 96)"><rect x="-11" y="-11" width="22" height="22" fill="#5b21b6" fill-opacity=".55" stroke="#c4b5fd" transform="rotate(25)"><animateTransform attributeName="transform" type="rotate" from="25" to="385" dur="6s" repeatCount="indefinite"/></rect></g>
    <polygon points="160,104 168,112 160,128 152,112" fill="#9d174d" fill-opacity=".55" stroke="#f9a8d4"/>
  </g>
  <!-- light-trail shot -->
  <path d="M150,190 L104,104" stroke="#a5f3fc" stroke-width="4" stroke-linecap="round" opacity=".55" filter="url(#glow)"/>
  <path d="M150,190 L104,104" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- shatter -->
  <g fill="#c4b5fd" filter="url(#glow)"><polygon points="128,84 134,80 132,88"><animate attributeName="opacity" values="1;0;1" dur="1.4s" repeatCount="indefinite"/></polygon><polygon points="106,82 100,78 103,88"><animate attributeName="opacity" values="0;1;0" dur="1.4s" repeatCount="indefinite"/></polygon></g>
  <!-- crosshair -->
  <g stroke="#fff" stroke-width="1.6"><path d="M100,92 v-6 M100,108 v6 M92,100 h-6 M108,100 h6"/></g>
  <!-- the arm cannon -->
  <polygon points="150,200 168,150 182,148 200,170 200,200" fill="#1e1b3a" stroke="#818cf8" stroke-width="1"/>
  <polygon points="160,160 150,180 158,184 168,162" fill="#67e8f9" opacity=".85" filter="url(#glow)"/>
</svg>
