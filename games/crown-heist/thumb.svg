<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".55" r=".8"><stop offset="0" stop-color="#5a1a12"/><stop offset=".6" stop-color="#1c0a06"/><stop offset="1" stop-color="#050302"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2b0"/><stop offset=".45" stop-color="#f5b82e"/><stop offset="1" stop-color="#8a540a"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fde68a" stop-opacity=".9"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbbf24" stop-opacity=".5"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- corridor walls -->
  <polygon points="0,0 55,50 55,150 0,200" fill="#3a2a16"/>
  <polygon points="200,0 145,50 145,150 200,200" fill="#2e2112"/>
  <rect x="55" y="50" width="90" height="100" fill="#1a1008"/>
  <g stroke="#120a04" stroke-width="2"><path d="M0,40 L55,78 M0,90 L55,104 M0,140 L55,128 M200,40 L145,78 M200,90 L145,104 M200,140 L145,128"/></g>
  <!-- portcullis -->
  <g stroke="#6b6b78" stroke-width="3"><path d="M65,50 V140 M80,50 V140 M95,50 V140 M110,50 V140 M125,50 V140 M135,50 V140 M55,70 H145 M55,105 H145"/></g>
  <!-- guard torch beam -->
  <polygon points="150,120 200,95 200,175" fill="url(#beam)"/>
  <!-- the crown -->
  <circle cx="100" cy="112" r="56" fill="url(#glow)"><animate attributeName="r" values="50;60;50" dur="2s" repeatCount="indefinite"/></circle>
  <path d="M70,135 L72,98 L86,114 L100,88 L114,114 L128,98 L130,135 Z" fill="url(#gold)" stroke="#7a4a08" stroke-width="1.5"/>
  <rect x="70" y="132" width="60" height="13" fill="url(#gold)" stroke="#7a4a08" stroke-width="1.5"/>
  <circle cx="100" cy="117" r="5" fill="#ef4444"/><circle cx="84" cy="122" r="3.5" fill="#22d3ee"/><circle cx="116" cy="122" r="3.5" fill="#22d3ee"/>
  <circle cx="72" cy="98" r="3" fill="#fff6d0"/><circle cx="100" cy="88" r="3.5" fill="#fff6d0"/><circle cx="128" cy="98" r="3" fill="#fff6d0"/>
  <!-- hand -->
  <path d="M84,200 L92,150 Q100,142 112,150 L122,200 Z" fill="#3a2416"/>
  <text x="100" y="30" text-anchor="middle" font-family="Georgia,serif" font-weight="900" font-size="18" fill="#fde047">NOW RUN.</text>
</svg>
