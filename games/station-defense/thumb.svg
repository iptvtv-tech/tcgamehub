<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="sky" cx=".5" cy=".35" r=".9"><stop offset="0" stop-color="#16163a"/><stop offset="1" stop-color="#05060f"/></radialGradient>
    <radialGradient id="neb" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#6d28d9" stop-opacity=".35"/><stop offset="1" stop-color="#6d28d9" stop-opacity="0"/></radialGradient>
    <radialGradient id="dome" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#c7d2fe"/><stop offset="1" stop-color="#312e81"/></radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="200" height="200" fill="url(#sky)"/>
  <circle cx="150" cy="60" r="70" fill="url(#neb)"/>
  <g fill="#cbd5e1" opacity=".75">
    <circle cx="18" cy="24" r="1.1"/><circle cx="182" cy="16" r="1.4"/><circle cx="170" cy="120" r="1"/><circle cx="12" cy="140" r="1.2"/>
    <circle cx="96" cy="10" r="1"/><circle cx="60" cy="92" r="1"/><circle cx="190" cy="180" r="1.1"/>
  </g>
  <!-- the lane: gate (top left) to the station (bottom) -->
  <path d="M 40 14 L 40 50 L 160 50 L 160 100 L 52 100 L 52 140 L 100 140 L 100 160" fill="none" stroke="#818cf8" stroke-opacity=".18" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 40 14 L 40 50 L 160 50 L 160 100 L 52 100 L 52 140 L 100 140 L 100 160" fill="none" stroke="#1e1b4b" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 40 14 L 40 50 L 160 50 L 160 100 L 52 100 L 52 140 L 100 140 L 100 160" fill="none" stroke="#a5b4fc" stroke-width="1.6" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- warp gate -->
  <circle cx="40" cy="14" r="9" fill="none" stroke="#c4b5fd" stroke-width="2.5" stroke-dasharray="20 8" filter="url(#glow)"/>
  <!-- turrets on their pads, laser beams -->
  <g>
    <polygon points="100,64 109,69 109,79 100,84 91,79 91,69" fill="#121633" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="100" cy="74" r="7" fill="#1b2140" stroke="#22d3ee" stroke-width="1.6"/>
    <rect x="99" y="58" width="3" height="14" fill="#cbd5e1" transform="rotate(-35 100 74)"/>
    <polygon points="124,114 133,119 133,129 124,134 115,129 115,119" fill="#121633" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="124" cy="124" r="7" fill="#1b2140" stroke="#22d3ee" stroke-width="1.6"/>
    <rect x="123" y="108" width="3" height="14" fill="#cbd5e1" transform="rotate(-80 124 124)"/>
  </g>
  <line x1="94" y1="66" x2="70" y2="50" stroke="#67e8f9" stroke-width="2" filter="url(#glow)"/>
  <line x1="112" y1="122" x2="80" y2="101" stroke="#67e8f9" stroke-width="2" filter="url(#glow)"/>
  <!-- ships -->
  <g filter="url(#glow)">
    <path d="M 76 50 L 64 44 L 67 50 L 64 56 Z" fill="#4ade80"/>
    <path d="M 128 50 L 114 43 L 118 50 L 114 57 Z" fill="#4ade80"/>
    <path d="M 82 100 L 94 92 L 99 93 L 96 100 L 99 107 L 94 108 Z" fill="#fb923c"/>
  </g>
  <!-- cannon shot and burst -->
  <circle cx="60" cy="122" r="11" fill="none" stroke="#c4b5fd" stroke-width="2" opacity=".8"/>
  <line x1="94" y1="166" x2="64" y2="126" stroke="#a5b4fc" stroke-width="2" stroke-dasharray="3 4"/>
  <!-- the station -->
  <path d="M 66 168 A 36 36 0 0 1 134 168" fill="none" stroke="#93c5fd" stroke-width="2" opacity=".7"/>
  <circle cx="100" cy="182" r="27" fill="#1e293b" stroke="#64748b" stroke-width="3"/>
  <rect x="88" y="160" width="7" height="20" fill="#94a3b8" transform="rotate(-38 92 176)"/>
  <circle cx="100" cy="182" r="12" fill="url(#dome)"/>
  <g fill="#a5b4fc"><circle cx="78" cy="176" r="1.6"/><circle cx="122" cy="176" r="1.6"/><circle cx="100" cy="162" r="1.6"/></g>
</svg>
