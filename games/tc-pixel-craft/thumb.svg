<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#dbeafe"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#sky)"/>
  <rect x="150" y="22" width="22" height="22" fill="#fef08a"/><rect x="146" y="18" width="30" height="30" fill="#fef08a" opacity=".3"/>
  <g fill="#fff"><rect x="24" y="30" width="34" height="8"/><rect x="32" y="24" width="18" height="8"/><rect x="96" y="44" width="24" height="6"/></g>
  <rect x="0" y="140" width="200" height="60" fill="url(#sea)"/>
  <!-- isometric voxel island: each block = top (bright), left (mid), right (dark) -->
  <g id="blk">
  </g>
  <g>
    <!-- helper pattern: block at (x,y) drawn via three polygons; 20px wide, 10px tall top, 12px sides -->
    <!-- back row -->
    <g transform="translate(80 86)"><polygon points="0,0 20,-10 40,0 20,10" fill="#6abe3c"/><polygon points="0,0 20,10 20,24 0,14" fill="#8b5a2b"/><polygon points="40,0 20,10 20,24 40,14" fill="#6b4220"/><polygon points="0,0 20,10 20,12 0,2" fill="#4c8f2a"/></g>
    <g transform="translate(60 96)"><polygon points="0,0 20,-10 40,0 20,10" fill="#6abe3c"/><polygon points="0,0 20,10 20,24 0,14" fill="#8b5a2b"/><polygon points="40,0 20,10 20,24 40,14" fill="#6b4220"/><polygon points="0,0 20,10 20,12 0,2" fill="#4c8f2a"/></g>
    <g transform="translate(100 96)"><polygon points="0,0 20,-10 40,0 20,10" fill="#6abe3c"/><polygon points="0,0 20,10 20,24 0,14" fill="#8b5a2b"/><polygon points="40,0 20,10 20,24 40,14" fill="#6b4220"/><polygon points="0,0 20,10 20,12 0,2" fill="#4c8f2a"/></g>
    <!-- raised stone block with ore -->
    <g transform="translate(120 92)"><polygon points="0,0 20,-10 40,0 20,10" fill="#a8a29e"/><polygon points="0,0 20,10 20,24 0,14" fill="#78716c"/><polygon points="40,0 20,10 20,24 40,14" fill="#57534e"/><rect x="6" y="5" width="4" height="3" fill="#fbbf24"/><rect x="28" y="8" width="4" height="3" fill="#22d3ee"/></g>
    <g transform="translate(40 106)"><polygon points="0,0 20,-10 40,0 20,10" fill="#6abe3c"/><polygon points="0,0 20,10 20,24 0,14" fill="#8b5a2b"/><polygon points="40,0 20,10 20,24 40,14" fill="#6b4220"/><polygon points="0,0 20,10 20,12 0,2" fill="#4c8f2a"/></g>
    <g transform="translate(80 106)"><polygon points="0,0 20,-10 40,0 20,10" fill="#6abe3c"/><polygon points="0,0 20,10 20,24 0,14" fill="#8b5a2b"/><polygon points="40,0 20,10 20,24 40,14" fill="#6b4220"/><polygon points="0,0 20,10 20,12 0,2" fill="#4c8f2a"/></g>
    <g transform="translate(120 106)"><polygon points="0,0 20,-10 40,0 20,10" fill="#6abe3c"/><polygon points="0,0 20,10 20,24 0,14" fill="#8b5a2b"/><polygon points="40,0 20,10 20,24 40,14" fill="#6b4220"/><polygon points="0,0 20,10 20,12 0,2" fill="#4c8f2a"/></g>
    <g transform="translate(60 116)"><polygon points="0,0 20,-10 40,0 20,10" fill="#e9d8a6"/><polygon points="0,0 20,10 20,24 0,14" fill="#d4b483"/><polygon points="40,0 20,10 20,24 40,14" fill="#b08d57"/></g>
    <g transform="translate(100 116)"><polygon points="0,0 20,-10 40,0 20,10" fill="#6abe3c"/><polygon points="0,0 20,10 20,24 0,14" fill="#8b5a2b"/><polygon points="40,0 20,10 20,24 40,14" fill="#6b4220"/><polygon points="0,0 20,10 20,12 0,2" fill="#4c8f2a"/></g>
    <g transform="translate(80 126)"><polygon points="0,0 20,-10 40,0 20,10" fill="#e9d8a6"/><polygon points="0,0 20,10 20,24 0,14" fill="#d4b483"/><polygon points="40,0 20,10 20,24 40,14" fill="#b08d57"/></g>
    <!-- tree: trunk + leaf cube -->
    <g transform="translate(90 64)"><polygon points="0,0 10,-5 20,0 10,5" fill="#7a4a22"/><polygon points="0,0 10,5 10,28 0,23" fill="#6b3f1d"/><polygon points="20,0 10,5 10,28 20,23" fill="#4a2a12"/></g>
    <g transform="translate(76 50)"><polygon points="0,0 24,-12 48,0 24,12" fill="#4ade80"/><polygon points="0,0 24,12 24,30 0,18" fill="#22a24a"/><polygon points="48,0 24,12 24,30 48,18" fill="#15803d"/>
      <rect x="10" y="-2" width="4" height="4" fill="#86efac"/><rect x="30" y="-4" width="4" height="4" fill="#86efac"/><rect x="6" y="12" width="4" height="4" fill="#166534"/><rect x="36" y="16" width="4" height="4" fill="#14532d"/></g>
    <!-- a floating crystal -->
    <g transform="translate(150 66)"><polygon points="0,-12 8,0 0,12 -8,0" fill="#67e8f9"/><polygon points="0,-12 8,0 0,0" fill="#cffafe"/><polygon points="0,12 -8,0 0,0" fill="#0891b2"/></g>
  </g>
  <!-- held pickaxe (first person) -->
  <g transform="translate(170 176) rotate(-35)">
    <rect x="-3" y="-30" width="6" height="40" fill="#8b5a2b"/><rect x="-3" y="-30" width="2" height="40" fill="#a8743a"/>
    <polygon points="-18,-32 0,-38 18,-32 14,-28 0,-32 -14,-28" fill="#9ca3af"/><polygon points="-18,-32 0,-38 0,-35 -14,-30" fill="#e5e7eb"/>
  </g>
</svg>
